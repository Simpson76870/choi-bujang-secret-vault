name: Stage 7 verification

on:
  push:
    branches:
      - main
      - stage3-auth-crud
      - stage4-owner-check
      - stage5-server-only-data-access
      - stage6-registered-device
      - stage7-risk-based-step-up
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-stage7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and package tests
        run: npm run test:r5 && npm run test:stage3 && npm run test:stage4 && npm run test:stage5 && npm run decider:test && npm run test:package

      - name: Build deployment identity manifest
        env:
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: Simpson76870
          VERCEL_GIT_REPO_SLUG: choi-bujang-secret-vault
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_URL: choi-bujang-secret-vault-git-main-simpson76870.vercel.app
        run: npm run build

      - name: Wait for public production branch to be ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://choi-bujang-secret-vault-git-main-simpson76870.vercel.app"
          ready=0
          status="unknown"
          manifest_status="unknown"
          expected_runtime_sha="$(git log -1 --format='%H' -- api/notes public/index.html src/notes-runtime.mjs src/verify-login.mjs aleph.config.json vercel.json package.json package-lock.json scripts/build-public.mjs)"
          if [ -z "$expected_runtime_sha" ]; then echo "Could not resolve the latest runtime-source commit."; exit 1; fi
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 5 -o /tmp/notes-response.json -w '%{http_code}' "$base/api/notes" || true)"
            manifest_status="$(curl -sS --max-time 5 -o /tmp/aleph-response.json -w '%{http_code}' "$base/aleph.json" || true)"
            if [ "$status" = "401" ] && grep -q '"AUTH_REQUIRED"' /tmp/notes-response.json \
              && [ "$manifest_status" = "200" ] && grep -q '"step": 7' /tmp/aleph-response.json \
              && grep -q "\"commit\": \"$expected_runtime_sha\"" /tmp/aleph-response.json; then
              echo "Unauthenticated API returned JSON 401; /aleph.json matches runtime-source commit $expected_runtime_sha (workflow commit $GITHUB_SHA)."
              ready=1
              break
            fi
            echo "Attempt $attempt: API HTTP $status; /aleph.json HTTP $manifest_status; waiting for runtime-source commit $expected_runtime_sha (workflow commit $GITHUB_SHA)."
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "Public production endpoint did not pass readiness checks."
            cat /tmp/notes-response.json 2>/dev/null || true
            cat /tmp/aleph-response.json 2>/dev/null || true
            exit 1
          fi

      - name: Generate stage 7 submission JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ALEPH_CHANGED_FILES_BASE: 8f2aed503f1f8cc1387730ee206e2e51d4e77b3f
        run: |
          printf '%s\n' '{"explanation":"7단계: 신뢰할 수 없는/누락된 접속 신호와 최근 사건은 정상값으로 채우지 않고 추가 확인을 요구합니다. 비정상 시간대·다른 네트워크·최근 다량 활동의 복합 가상 사건은 step_up_required이며 지역 하나만으로 차단하지 않습니다.","blockedAt":"실제 운영 재로그인 시각 검증 및 그 전후 자료 차단/재허용은 미실측; decider:test는 가상 요청"}' > bundle-notes.json
          npm run bundle
          cat artifacts/submission.json

      - name: Verify live checks in the submission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const bundle = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          assert.equal(bundle.schema, 'aleph.defense.submission.v2');
          assert.equal(bundle.step, 7);
          const observed = new Map(bundle.attackAttempts.map(item => [item.attackId, item.observed]));
          assert.match(observed.get('homepage_security_header') ?? '', /보안 헤더/u);
          assert.match(observed.get('anonymous_notes_list') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('anonymous_note_item') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('static_data_removed') ?? '', /HTTP 404/u);
          assert.match(observed.get('deployment_manifest') ?? '', /단계 7/u);
          assert.match(observed.get('anonymous_direct_data_api') ?? '', /anon direct Data API는 권한 오류로 거부함/u);
          console.log('7단계 실배포 검사 여섯 항목이 모두 기대한 결과를 냈습니다.');
          NODE

      - name: Upload stage 7 submission JSON
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stage7-submission
          path: artifacts/submission.json
          if-no-files-found: warn
          retention-days: 14

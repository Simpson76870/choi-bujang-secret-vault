<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 780px; margin: 0 auto; padding: 34px 20px 60px; }
    .eyebrow { color: #8ad8df; font-size: 13px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 13px 0 8px; font-size: clamp(30px, 7vw, 44px); line-height: 1.2; }
    p { color: #bfd0e5; line-height: 1.65; }
    .panel { margin-top: 23px; padding: 21px; border: 1px solid #344b64; border-radius: 16px; background: #142337; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    label { display: block; margin: 13px 0 6px; font-weight: 650; }
    input, textarea { width: 100%; padding: 12px 13px; border: 1px solid #425b75; border-radius: 9px; background: #0b1421; color: #f2f7ff; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    input:focus, textarea:focus, button:focus-visible { outline: 2px solid #8ad8df; outline-offset: 2px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button { border: 1px solid #54708d; border-radius: 9px; padding: 10px 15px; background: #21364e; color: #f2f7ff; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { border-color: #8ad8df; background: #8ad8df; color: #10202e; }
    button.danger { border-color: #a75f70; background: #412632; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 1.5em; margin: 12px 0 0; color: #a9e6e8; overflow-wrap: anywhere; }
    .status.error { color: #ffb9c2; }
    .muted { color: #9fb4ca; font-size: 14px; }
    .account-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    ul { display: grid; gap: 12px; list-style: none; margin: 16px 0 0; padding: 0; }
    li.note { border: 1px solid #405872; border-radius: 13px; padding: 15px; background: #192b40; overflow-wrap: anywhere; }
    .note strong { display: block; font-size: 18px; margin-bottom: 7px; }
    .note p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note .actions { margin-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 8단계 자원 구역 보호</div>
    <h1>로그인 자료실</h1>
    <p>Supabase Auth로 로그인한 뒤 본인 소유의 가상 메모만 조회·추가·수정·삭제할 수 있습니다. 다른 사용자의 메모 ID를 사용해도 서버에서 소유권을 확인합니다.</p>

    <section class="panel" id="auth-panel" aria-labelledby="auth-heading">
      <h2 id="auth-heading">이메일 로그인</h2>
      <p class="muted">계정이 없다면 ‘계정 만들기’를 이용하세요. 이메일 인증이 필요한 경우 인증 메일을 확인한 뒤 이 페이지로 돌아와 로그인합니다.</p>
      <form id="auth-form">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128">
        <div class="actions">
          <button class="primary" type="submit" name="authAction" value="login">로그인</button>
          <button type="submit" name="authAction" value="signup">계정 만들기</button>
        </div>
      </form>
      <p class="status" id="auth-status" role="status" aria-live="polite">Supabase 로그인 기능을 준비하고 있습니다.</p>
    </section>

    <section class="panel" id="notes-panel" hidden aria-labelledby="notes-heading">
      <div class="account-row">
        <div>
          <h2 id="notes-heading">내 가상 메모</h2>
          <p class="muted" id="signed-in-as"></p>
        </div>
        <button id="sign-out" type="button">로그아웃</button>
      </div>
      <form id="note-form">
        <input id="editing-id" type="hidden">
        <label for="note-title">제목</label>
        <input id="note-title" name="title" maxlength="120" required>
        <label for="note-body">본문</label>
        <textarea id="note-body" name="body" maxlength="2000" required></textarea>
        <div class="actions">
          <button class="primary" id="save-note" type="submit">메모 추가</button>
          <button id="cancel-edit" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p class="status" id="notes-status" role="status" aria-live="polite"></p>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>

  <script type="module">
    const SUPABASE_URL = 'https://hjuczlxovnghkljzygoz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IGhfplhv5pb4QpsGPHKgWw_ef8Djp2Z';
    const PROVISIONED_NOTE_ID = '10000000-0000-4000-8000-000000000099';
    const $ = (selector) => document.querySelector(selector);
    const authForm = $('#auth-form');
    const authPanel = $('#auth-panel');
    const authStatus = $('#auth-status');
    const notesPanel = $('#notes-panel');
    const notesList = $('#notes');
    const notesStatus = $('#notes-status');
    const noteForm = $('#note-form');
    const noteTitle = $('#note-title');
    const noteBody = $('#note-body');
    const editingIdInput = $('#editing-id');
    const saveNoteButton = $('#save-note');
    const cancelEditButton = $('#cancel-edit');
    let supabase;
    let session = null;
    let activeUserId = null;
    let busy = false;

    function setStatus(element, message, isError = false) {
      element.textContent = message || '';
      element.classList.toggle('error', isError);
    }

    function setBusy(value) {
      busy = value;
      authForm.querySelectorAll('button').forEach((button) => { button.disabled = value; });
      saveNoteButton.disabled = value;
      $('#sign-out').disabled = value;
    }

    function resetEditor() {
      editingIdInput.value = '';
      noteForm.reset();
      saveNoteButton.textContent = '메모 추가';
      cancelEditButton.hidden = true;
    }

    function showSession(nextSession) {
      const nextUserId = nextSession?.user?.id ?? null;
      const changedUser = nextUserId !== activeUserId;
      activeUserId = nextUserId;
      session = nextSession;
      const signedIn = Boolean(session?.access_token && session?.user?.id);
      authPanel.hidden = signedIn;
      notesPanel.hidden = !signedIn;

      if (!signedIn) {
        notesList.replaceChildren();
        setStatus(notesStatus, '');
        resetEditor();
        return;
      }

      $('#signed-in-as').textContent = session.user.email || session.user.id;
      if (changedUser) queueMicrotask(() => loadNotes());
    }

    function authHeaders() {
      if (!session?.access_token) throw new Error('로그인이 필요합니다. 다시 로그인해 주세요.');
      return { Authorization: 'Bearer ' + session.access_token };
    }

    async function readJson(response) {
      let payload = {};
      try { payload = await response.json(); } catch {}
      if (!response.ok) {
        const messages = {
          AUTH_REQUIRED: '로그인이 만료되었습니다. 다시 로그인해 주세요.',
          NOTE_NOT_FOUND: '메모를 찾을 수 없거나 현재 계정의 소유가 아닙니다.',
          RESOURCE_SCOPE_REQUIRED: '현재 단계에서는 목록·생성 권한이 등록되지 않았습니다.',
          RESOURCE_NOT_ALLOWED: '등록되지 않은 구역의 자료에는 접근할 수 없습니다.',
          NOTE_CONFLICT: payload.message || '같은 제목의 메모가 이미 있습니다.',
          INVALID_NOTE: payload.message || '제목과 본문을 확인해 주세요.',
          NOTES_UNAVAILABLE: '자료 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.',
          NOTES_SERVICE_NOT_CONFIGURED: '서버 설정이 완료되지 않았습니다. 관리자에게 알려 주세요.'
        };
        throw new Error(messages[payload.error] || payload.message || ('요청 실패 (HTTP ' + response.status + ')'));
      }
      return payload;
    }

    async function apiRequest(path, options = {}) {
      const headers = { ...authHeaders(), ...(options.headers || {}) };
      if (options.body) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, { ...options, headers, cache: 'no-store' });
      return readJson(response);
    }

    async function loadNotes() {
      if (!session?.access_token) return;
      setStatus(notesStatus, '등록된 메모를 확인하는 중입니다.');
      try {
        const note = await apiRequest('/api/notes/' + encodeURIComponent(PROVISIONED_NOTE_ID));
        if (note.id !== PROVISIONED_NOTE_ID || typeof note.title !== 'string' || typeof note.body !== 'string') {
          throw new Error('등록된 메모 응답 형식이 올바르지 않습니다.');
        }
        notesList.replaceChildren();
        const item = document.createElement('li');
        item.className = 'note';
        const title = document.createElement('strong');
        const body = document.createElement('p');
        const actions = document.createElement('div');
        const editButton = document.createElement('button');
        actions.className = 'actions';
        title.textContent = note.title;
        body.textContent = note.body;
        editButton.type = 'button';
        editButton.textContent = '수정';
        editButton.addEventListener('click', () => {
          editingIdInput.value = note.id;
          noteTitle.value = note.title;
          noteBody.value = note.body;
          saveNoteButton.textContent = '수정 저장';
          cancelEditButton.hidden = false;
          noteTitle.focus();
        });
        actions.append(editButton);
        item.append(title, body, actions);
        notesList.append(item);
        setStatus(notesStatus, '등록된 메모를 불러왔습니다.');
      } catch (error) {
        notesList.replaceChildren();
        setStatus(notesStatus, error.message, true);
      }
    }

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (busy) return;
      const email = $('#email').value.trim();
      const password = $('#password').value;
      const action = event.submitter?.value || 'login';
      setBusy(true);
      setStatus(authStatus, action === 'signup' ? '계정을 만드는 중입니다.' : '로그인 중입니다.');
      try {
        if (action === 'signup') {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) {
            showSession(data.session);
            setStatus(notesStatus, '계정 생성과 로그인이 완료되었습니다.');
          } else {
            setStatus(authStatus, '가입 요청을 접수했습니다. 이메일 인증이 필요하면 받은 편지함에서 인증한 뒤 이 페이지에서 로그인하세요.');
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showSession(data.session);
          setStatus(notesStatus, '로그인했습니다.');
        }
      } catch (error) {
        setStatus(authStatus, error.message || '로그인에 실패했습니다.', true);
      } finally {
        setBusy(false);
      }
    });

    $('#sign-out').addEventListener('click', async () => {
      if (busy) return;
      setBusy(true);
      try {
        const { error } = await supabase.auth.signOut();
        if (error) throw error;
        showSession(null);
        setStatus(authStatus, '로그아웃했습니다.');
      } catch (error) {
        setStatus(notesStatus, error.message || '로그아웃에 실패했습니다.', true);
      } finally {
        setBusy(false);
      }
    });

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (busy) return;
      const id = editingIdInput.value;
      if (id !== PROVISIONED_NOTE_ID) {
        setStatus(notesStatus, '현재는 등록된 메모만 수정할 수 있습니다. 목록에서 수정할 메모를 선택하세요.', true);
        return;
      }
      const payload = { title: noteTitle.value.trim(), body: noteBody.value };
      if (!payload.title || payload.title.length > 120 || payload.body.length > 2000) {
        setStatus(notesStatus, '제목은 1~120자, 본문은 2,000자 이하로 입력해 주세요.', true);
        return;
      }
      setBusy(true);
      setStatus(notesStatus, id ? '메모를 수정하는 중입니다.' : '메모를 추가하는 중입니다.');
      try {
        await apiRequest('/api/notes/' + encodeURIComponent(id), {
          method: 'PUT', body: JSON.stringify(payload)
        });
        setStatus(notesStatus, '메모를 수정했습니다.');
        resetEditor();
        await loadNotes();
      } catch (error) {
        setStatus(notesStatus, error.message, true);
      } finally {
        setBusy(false);
      }
    });

    cancelEditButton.addEventListener('click', resetEditor);

    try {
      const sdk = await import('https://esm.sh/@supabase/supabase-js@2.117.2');
      supabase = sdk.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      supabase.auth.onAuthStateChange((_event, nextSession) => showSession(nextSession));
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      showSession(data.session);
      if (!data.session) setStatus(authStatus, '이메일과 비밀번호로 로그인하거나 계정을 만드세요.');
    } catch (error) {
      authForm.querySelectorAll('button').forEach((button) => { button.disabled = true; });
      setStatus(authStatus, '로그인 SDK를 불러오지 못했습니다. 페이지를 새로고침하거나 관리자에게 알려 주세요.', true);
    }
  </script>
</body>
</html>

name: Stage 10 verification

on:
  push:
    branches:
      - main
      - stage3-auth-crud
      - stage4-owner-check
      - stage5-server-only-data-access
      - stage6-registered-device
      - stage7-risk-based-step-up
      - stage8-resource-zones
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-stage10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and package tests
        run: npm run test:r5 && npm run test:stage3 && npm run test:stage4 && npm run test:stage5 && npm run decider:test && npm run detect:test && npm run test:stage9 && npm run test:stage8 && npm run test:package && npm run test:stage10

      - name: Build deployment identity manifest
        env:
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: Simpson76870
          VERCEL_GIT_REPO_SLUG: choi-bujang-secret-vault
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_URL: choi-bujang-secret-vault-git-main-simpson76870.vercel.app
        run: npm run build

      - name: Wait for public production branch to be ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://choi-bujang-secret-vault-git-main-simpson76870.vercel.app"
          ready=0
          status="unknown"
          manifest_status="unknown"
          expected_deployment_sha="$GITHUB_SHA"
          if ! [[ "$expected_deployment_sha" =~ ^[a-f0-9]{40}$ ]]; then echo "Could not resolve the workflow commit SHA."; exit 1; fi
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 5 -o /tmp/notes-response.json -w '%{http_code}' "$base/api/notes" || true)"
            manifest_status="$(curl -sS --max-time 5 -o /tmp/aleph-response.json -w '%{http_code}' "$base/aleph.json" || true)"
            if [ "$status" = "401" ] && grep -q '"AUTH_REQUIRED"' /tmp/notes-response.json \
              && [ "$manifest_status" = "200" ] && grep -q '"step": 10' /tmp/aleph-response.json \
              && grep -q "\"commit\": \"$expected_deployment_sha\"" /tmp/aleph-response.json; then
              echo "Unauthenticated API returned JSON 401; /aleph.json matches deployed commit $expected_deployment_sha."
              ready=1
              break
            fi
            echo "Attempt $attempt: API HTTP $status; /aleph.json HTTP $manifest_status; waiting for deployed commit $expected_deployment_sha."
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "Public production endpoint did not pass readiness checks."
            cat /tmp/notes-response.json 2>/dev/null || true
            cat /tmp/aleph-response.json 2>/dev/null || true
            exit 1
          fi

      - name: Generate stage 10 submission JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ALEPH_CHANGED_FILES_BASE: d689e40a1763ab97e46b906e4612bd587f2072b4
        run: |
          printf '%s\n' '{"explanation":"10단계는 환경 변수로 주입된 B 메모 사본의 원문 SHA-256과 내용 SHA-256을 각각 timingSafeEqual로 검증하고, 복구 직전 사본을 다시 읽어 동일성을 확인합니다. 복구 성공 후에는 같은 인증 토큰으로 본인 메모 GET과 타인 메모 GET을 실행하고 응답 상태·메타데이터만 restore.retests에 담으며, 감사 기록은 서버 프로세스 내부 append-only 메모리에 기록합니다. 정책 사본은 backups/step10의 JSON과 SHA-256으로 검증하며 restore:plan과 확인 버전 지정 restore:apply는 artifacts/만 씁니다.","blockedAt":"GitHub CI에서는 비로그인 GET 요청과 회귀 테스트만 실행했습니다. 인증된 실제 B 메모 복원과 그 뒤 HTTP 재시험은 실행하지 않았으므로 CI 제출 기록에서 성공으로 주장하지 않습니다. 공식 심판 환경이 제공하는 비공개 환경 변수와 B 신원으로 실행된 restore.retests 결과만 실제 복원 증거입니다."}' > bundle-notes.json
          npm run bundle
          cat artifacts/submission.json

      - name: Verify live checks in the submission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const bundle = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          assert.equal(bundle.schema, 'aleph.defense.submission.v2');
          assert.equal(bundle.step, 10);
          const observed = new Map(bundle.attackAttempts.map(item => [item.attackId, item.observed]));
          assert.match(observed.get('homepage_security_header') ?? '', /보안 헤더/u);
          assert.match(observed.get('anonymous_notes_list') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('anonymous_note_item') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('static_data_removed') ?? '', /HTTP 404/u);
          assert.match(observed.get('deployment_manifest') ?? '', /단계 10/u);
          assert.match(observed.get('anonymous_direct_data_api') ?? '', /anon direct Data API는 권한 오류로 거부함/u);
          assert.match(observed.get('notes_audit_unauthenticated') ?? '', /인증 없는 감사 요청을 JSON 오류로 거부함/u);
          assert.match(observed.get('restore_note_unauthenticated') ?? '', /인증 없는 복구 요청을 JSON 오류로 거부함/u);
          console.log('10단계 제출 묶음의 공개 HTTP 점검 여덟 항목을 확인했습니다. 이는 로그인한 실제 복구나 심판 통과의 증거가 아닙니다.');
          NODE

      - name: Upload stage 10 submission JSON
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stage10-submission
          path: artifacts/submission.json
          if-no-files-found: warn
          retention-days: 14

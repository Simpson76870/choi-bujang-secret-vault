name: Stage 9 verification

on:
  push:
    branches:
      - main
      - stage3-auth-crud
      - stage4-owner-check
      - stage5-server-only-data-access
      - stage6-registered-device
      - stage7-risk-based-step-up
      - stage8-resource-zones
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-stage9:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Probe public judge page without credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://aleph-omega.vercel.app';
          const response = await fetch(base + '/defense', { redirect: 'follow', signal: AbortSignal.timeout(15000) });
          const html = await response.text();
          const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m => m[1]);
          const queue = [...scripts, 'assets/auth.js', 'assets/defense-campaign-live.js'];
          const seen = new Set();
          const assets = [];
          while (queue.length && seen.size < 12) {
            const path = queue.shift();
            const url = new URL(path, base + '/defense').href;
            if (seen.has(url)) continue;
            seen.add(url);
            const r = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const source = await r.text();
            const importPaths = [...source.matchAll(/from\s+['"]([^'"]+\.js)['"]/g)].map(m => m[1]);
            for (const imp of importPaths) {
              if (imp.startsWith('./') || imp.startsWith('../')) queue.push(new URL(imp, url).pathname);
            }
            assets.push({
              path,
              status: r.status,
              length: source.length,
              imports: importPaths,
              relevantLines: source.split(/\r?\n/).filter(line =>
                /fetch\(|\/api\/|supabase|auth|session|judge|submit|score|mission|campaign|rpc\(|\.from\(|\.rpc\(|Authorization|Bearer|student|class_id|defense|revocation/i.test(line)
              ).map(line => line.slice(0, 1400)).slice(0, 120)
            });
          }
          console.log(JSON.stringify({
            requestedUrl: base + '/defense',
            status: response.status,
            title: html.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1] ?? null,
            assets
          }, null, 2));
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and package tests
        run: npm run test:r5 && npm run test:stage3 && npm run test:stage4 && npm run test:stage5 && npm run decider:test && npm run detect:test && npm run test:stage9 && npm run test:stage8 && npm run test:package

      - name: Build deployment identity manifest
        env:
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: Simpson76870
          VERCEL_GIT_REPO_SLUG: choi-bujang-secret-vault
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_URL: choi-bujang-secret-vault-git-main-simpson76870.vercel.app
        run: npm run build

      - name: Wait for public production branch to be ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://choi-bujang-secret-vault-git-main-simpson76870.vercel.app"
          ready=0
          status="unknown"
          manifest_status="unknown"
          expected_deployment_sha="$GITHUB_SHA"
          if ! [[ "$expected_deployment_sha" =~ ^[a-f0-9]{40}$ ]]; then echo "Could not resolve the workflow commit SHA."; exit 1; fi
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 5 -o /tmp/notes-response.json -w '%{http_code}' "$base/api/notes" || true)"
            manifest_status="$(curl -sS --max-time 5 -o /tmp/aleph-response.json -w '%{http_code}' "$base/aleph.json" || true)"
            if [ "$status" = "401" ] && grep -q '"AUTH_REQUIRED"' /tmp/notes-response.json \
              && [ "$manifest_status" = "200" ] && grep -q '"step": 9' /tmp/aleph-response.json \
              && grep -q "\"commit\": \"$expected_deployment_sha\"" /tmp/aleph-response.json; then
              echo "Unauthenticated API returned JSON 401; /aleph.json matches deployed commit $expected_deployment_sha."
              ready=1
              break
            fi
            echo "Attempt $attempt: API HTTP $status; /aleph.json HTTP $manifest_status; waiting for deployed commit $expected_deployment_sha."
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "Public production endpoint did not pass readiness checks."
            cat /tmp/notes-response.json 2>/dev/null || true
            cat /tmp/aleph-response.json 2>/dev/null || true
            exit 1
          fi

      - name: Generate stage 9 submission JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ALEPH_CHANGED_FILES_BASE: 33ac72830c9c312b9a4c4060f6a8a5be6d0c6098
        run: |
          printf '%s\n' '{"explanation":"9단계: 가명 사용자·확인된 가상 기기·요청 메서드·판정·네트워크만 화이트리스트로 읽습니다. 동일 주체/기기의 10분 창 안 허용 GET 121건 이상과 비정상 네트워크가 함께 있을 때에만 burst_read 탐지 결과와 단일 기기 회수 제안을 냅니다. 기존 접속 판정 응답은 변경하지 않습니다.","blockedAt":"실제 운영 엔진의 기기/네트워크 사건 전달, 회수 집행 및 첫 의심 요청부터의 경과 시간 측정은 미실행입니다. detectDeviceEvents는 source=local_virtual_fixture인 가상 입력만 처리합니다."}' > bundle-notes.json
          npm run bundle
          cat artifacts/submission.json

      - name: Verify live checks in the submission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const bundle = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          assert.equal(bundle.schema, 'aleph.defense.submission.v2');
          assert.equal(bundle.step, 9);
          const observed = new Map(bundle.attackAttempts.map(item => [item.attackId, item.observed]));
          assert.match(observed.get('homepage_security_header') ?? '', /보안 헤더/u);
          assert.match(observed.get('anonymous_notes_list') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('anonymous_note_item') ?? '', /JSON 오류로 거부함 \(HTTP 401\)/u);
          assert.match(observed.get('static_data_removed') ?? '', /HTTP 404/u);
          assert.match(observed.get('deployment_manifest') ?? '', /단계 9/u);
          assert.match(observed.get('anonymous_direct_data_api') ?? '', /anon direct Data API는 권한 오류로 거부함/u);
          console.log('9단계 제출 묶음의 공개 HTTP 점검 여섯 항목을 확인했습니다. 이는 실제 회수나 심판 통과의 증거가 아닙니다.');
          NODE

      - name: Upload stage 9 submission JSON
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stage9-submission
          path: artifacts/submission.json
          if-no-files-found: warn
          retention-days: 14
